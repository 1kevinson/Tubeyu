services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tubeyu-backend
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: ${NODE_ENV:?Set NODE_ENV in .env}
      PORT: ${BACKEND_PORT:?Set BACKEND_PORT in .env}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    volumes:
      - ./backend:/app
      - backend_pnpm_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "pnpm run prisma:generate && pnpm run dev"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tubeyu-frontend
    environment:
      NODE_ENV: ${NODE_ENV:?Set NODE_ENV in .env}
      VITE_API_URL: ${VITE_API_URL:?Set VITE_API_URL in .env}
    ports:
      - "${FRONTEND_PORT:?Set FRONTEND_PORT in .env}:5173"
    volumes:
      - ./frontend:/app
      - frontend_pnpm_node_modules:/app/node_modules
    depends_on:
      - backend
    command: pnpm run dev --host 0.0.0.0

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: tubeyu-worker
    environment:
      NODE_ENV: ${NODE_ENV:?Set NODE_ENV in .env}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env}
    volumes:
      - ./worker:/app
      - worker_pnpm_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
    command: pnpm run start:dev

  db:
    build:
      context: ./database
      dockerfile: Dockerfile
    container_name: tubeyu-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      - "${POSTGRES_PORT:?Set POSTGRES_PORT in .env}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  broker:
    build:
      context: ./broker
      dockerfile: Dockerfile
    container_name: tubeyu-broker
    ports:
      - "${REDIS_PORT:?Set REDIS_PORT in .env}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_data:
  backend_pnpm_node_modules:
  frontend_pnpm_node_modules:
  worker_pnpm_node_modules:
