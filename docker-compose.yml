services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tubeyu-backend
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://tubeyu:tubeyu@db:5432/tubeyu
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tubeyu-frontend
    environment:
      NODE_ENV: development
      VITE_API_URL: http://localhost:3000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: tubeyu-worker
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://tubeyu:tubeyu@db:5432/tubeyu
      REDIS_URL: redis://caching:6379
    volumes:
      - ./worker:/app
      - worker_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
      caching:
        condition: service_healthy
    command: npm run start:dev

  db:
    build:
      context: ./database
      dockerfile: Dockerfile
    container_name: tubeyu-db
    environment:
      POSTGRES_USER: tubeyu
      POSTGRES_PASSWORD: tubeyu
      POSTGRES_DB: tubeyu
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tubeyu -d tubeyu"]
      interval: 5s
      timeout: 5s
      retries: 10

  caching:
    build:
      context: ./caching
      dockerfile: Dockerfile
    container_name: tubeyu-caching
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_data:
  backend_node_modules:
  frontend_node_modules:
  worker_node_modules:
